name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests (PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neuro
          POSTGRES_PASSWORD: neuro
          POSTGRES_DB: neurosense_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U neuro -d neurosense_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the CI image small; drop the version pins
          # from requirements.txt that would pull CUDA wheels.
          grep -v -E '^(torch|torchvision)' requirements.txt > /tmp/req.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/req.txt

      - name: Run tests (against real PostgreSQL)
        env:
          SECRET_KEY: ci-test-secret-key
          TESTING: 'true'
          SEED_DEMO_DATA: 'true'
          EXPOSE_RESET_TOKEN: 'true'
          TEST_DATABASE_URL: postgresql://neuro:neuro@localhost:5432/neurosense_test
        run: python -m pytest -q

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (login → wizard → results)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # Light backend install: the analysis pipeline's ML deps (torch,
      # whisper) are lazy imports, so the API boots and serves every endpoint
      # without them — MRI predictions degrade to a module warning, which the
      # spec tolerates.
      - name: Install backend dependencies (without ML weights)
        run: |
          python -m pip install --upgrade pip
          grep -v -E '^(torch|torchvision|faster-whisper|openai-whisper|matplotlib|scikit-image|opencv|nibabel|nilearn)' ../backend/requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          SECRET_KEY: ci-e2e-secret-key
          TESTING: 'true'
          SEED_DEMO_DATA: 'true'
        run: npm run e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
