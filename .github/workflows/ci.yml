name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the CI image small; drop the version pins
          # from requirements.txt that would pull CUDA wheels.
          grep -v -E '^(torch|torchvision)' requirements.txt > /tmp/req.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/req.txt

      - name: Run tests
        env:
          SECRET_KEY: ci-test-secret-key
          TESTING: 'true'
          SEED_DEMO_DATA: 'true'
          EXPOSE_RESET_TOKEN: 'true'
        run: python -m pytest -q

  frontend:
    name: Frontend lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Non-blocking while the pre-existing error baseline (~50) is worked
        # down; flip to blocking once `npx eslint .` is clean.
        run: npm run lint
        continue-on-error: true

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
