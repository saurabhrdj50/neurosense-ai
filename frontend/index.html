<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NeuroSense Advanced — Multimodal AI platform for Alzheimer's detection using MRI, cognitive assessment, and behavioral analysis." />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8FAFC" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B1120" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NeuroSense Advanced" />
    <meta property="og:title" content="NeuroSense Advanced — AI Alzheimer's Detection" />
    <meta property="og:description" content="Multimodal AI platform for Alzheimer's detection: MRI classification, cognitive screening, and speech analysis fused into one clinical report." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>NeuroSense Advanced — AI Alzheimer's Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Render-blocking font CSS moved here from index.css so weights 800/900
         (used by font-extrabold/font-black) are actually downloaded instead of
         faux-bolded by the browser, and Sora is available as the display face. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans:wght@400;500;600;700&family=Sora:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <script>
      /* Apply the persisted (or system) theme BEFORE React boots so the first
         paint already carries the `dark` class — no white flash on load. Must
         stay in sync with getInitialTheme() in src/providers/ThemeProvider.jsx. */
      (function () {
        try {
          var stored = localStorage.getItem('neurosense_theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.classList.toggle('light', !dark);
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) { /* noop */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
