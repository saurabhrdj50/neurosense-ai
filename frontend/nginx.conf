# NeuroSense AI frontend — nginx configuration (production-hardened).
#
# The /api proxy makes the API same-origin for the browser: cookies flow
# without SameSite=None, and the Vite build should be made with
# VITE_API_URL="" so apiClient hits relative /api paths.

# Never advertise the nginx version.
server_tokens off;

# Shared zone: brute-force protection on the login surface at the edge, in
# addition to the application's own slowapi limits (10/min per IP+user).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=600r/m;

upstream neurosense_api {
    server api:10000;
    keepalive 32;
}

server {
    listen 80;
    # IPv6 listener: loopback clients that resolve localhost to ::1 (e.g.
    # busybox wget) would otherwise be refused.
    listen [::]:80;
    server_name _;

    # When TLS terminates here, enable HSTS (uncomment + set your domain):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers for the SPA shell
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(self), geolocation=()" always;

    # Gzip JSON (analysis result blobs compress ~10x) and static assets
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1000;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_vary on;

    # Auth surface: strict edge rate limit before it even reaches the API
    location /api/auth/ {
        limit_req zone=auth_zone burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://neurosense_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 1m;
        proxy_read_timeout 30s;
    }

    # SSE events stream: disable buffering so data-version events arrive immediately
    location = /api/meta/events {
        proxy_pass http://neurosense_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 86400s;
    }

    # General API: larger uploads (MRI/audio), longer reads for reports
    location /api/ {
        limit_req zone=api_zone burst=100 nodelay;
        limit_req_status 429;

        proxy_pass http://neurosense_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
    }

    # Liveness probe target for orchestrators that probe nginx itself
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Hashed static assets are immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA artifacts must revalidate on every deploy so clients pick up the
    # new service worker + manifest instead of running a stale app shell.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: every non-file route serves index.html. Never cached —
    # hashed asset URLs change per deploy and index.html points at them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
