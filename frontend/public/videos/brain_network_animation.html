<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>NeuroSense AI — Animated Brain Network (transparent)</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: transparent; /* fully transparent — drop this over any page background */
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100vh;
    background: transparent;
    overflow: hidden;
  }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
</div>

<script>
(function () {
  const canvas = document.getElementById('c');
  const stage = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: true });

  let W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    const rect = stage.getBoundingClientRect();
    W = rect.width;
    H = rect.height;
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- Palette ----------
  // purple-dominant, magenta core, cyan highlights — matches the brand mark
  const PALETTE = [
    { hex: '#8B7CF6', w: 0.50 }, // indigo/purple
    { hex: '#C084FC', w: 0.16 }, // light violet
    { hex: '#F472B6', w: 0.18 }, // pink/magenta
    { hex: '#5EEAD4', w: 0.08 }, // teal
    { hex: '#60A5FA', w: 0.08 }, // blue/cyan
  ];
  function pickColor() {
    let r = Math.random(), acc = 0;
    for (const p of PALETTE) { acc += p.w; if (r <= acc) return p.hex; }
    return PALETTE[0].hex;
  }
  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return { r: (n >> 16) & 255, g: (n >> 8) & 255, b: n & 255 };
  }

  // ---------- Shape: organic "neural brain" point cloud ----------
  const N_MESH = 460;     // structural wireframe points
  const N_SPARK = 46;     // bright highlight nodes
  const N_DUST = 60;      // ambient floating particles around the form

  const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));

  function crossRadius(h) {
    // h: -1 (top) .. 1 (bottom). Rounded dome on top, tapers to a point (brain-stem) at bottom.
    if (h <= 0) {
      const hh = h * 0.95;
      return Math.sqrt(Math.max(0, 1 - hh * hh));
    }
    return Math.pow(Math.max(0, 1 - h * h), 0.8);
  }

  function makePoint(i, n, seedOffset, radialJitter) {
    const h = 1 - (2 * (i + 0.5)) / n;               // -1..1, top..bottom
    const phi = (i * GOLDEN_ANGLE + seedOffset) % (Math.PI * 2);

    const lobe = 1 + 0.10 * Math.cos(2 * phi);
    const fold = 1
      + 0.05 * Math.sin(6 * phi + h * 8)
      + 0.035 * Math.sin(10 * phi - h * 5);
    const jitter = 1 + (Math.random() - 0.5) * radialJitter;

    const rXZ = crossRadius(h) * lobe * fold * jitter;
    const phi2 = phi;

    return {
      // base (unrotated) coordinates
      bx: rXZ * Math.cos(phi2),
      bz: rXZ * Math.sin(phi2),
      by: h * 0.86,
      color: pickColor(),
      phase: Math.random() * Math.PI * 2,
      freq: 0.6 + Math.random() * 1.1,
      size: 0,
    };
  }

  const meshPoints = [];
  for (let i = 0; i < N_MESH; i++) {
    const p = makePoint(i, N_MESH, 0, 0.07);
    p.size = 1.1 + Math.random() * 1.3;
    meshPoints.push(p);
  }

  const sparkPoints = [];
  for (let i = 0; i < N_SPARK; i++) {
    const p = makePoint(i, N_SPARK, 1.7, 0.02);
    const scaleOut = 1.02 + Math.random() * 0.08;
    p.bx *= scaleOut; p.by *= scaleOut; p.bz *= scaleOut;
    p.size = 2.2 + Math.random() * 2.2;
    p.freq = 0.9 + Math.random() * 1.6;
    sparkPoints.push(p);
  }

  const dustPoints = [];
  for (let i = 0; i < N_DUST; i++) {
    const theta = Math.random() * Math.PI * 2;
    const elev = (Math.random() - 0.5) * Math.PI;
    const r = 1.25 + Math.random() * 0.85;
    dustPoints.push({
      bx: r * Math.cos(elev) * Math.cos(theta),
      by: r * Math.sin(elev) * 0.9,
      bz: r * Math.cos(elev) * Math.sin(theta),
      color: pickColor(),
      phase: Math.random() * Math.PI * 2,
      freq: 0.3 + Math.random() * 0.5,
      size: 0.8 + Math.random() * 1.6,
      driftSpeed: (Math.random() - 0.5) * 0.06,
    });
  }

  // ---------- Wireframe edges: connect each mesh point to its nearest neighbours ----------
  const edges = [];
  {
    const K = 3;
    for (let i = 0; i < meshPoints.length; i++) {
      const pi = meshPoints[i];
      const dists = [];
      for (let j = 0; j < meshPoints.length; j++) {
        if (i === j) continue;
        const pj = meshPoints[j];
        const dx = pi.bx - pj.bx, dy = pi.by - pj.by, dz = pi.bz - pj.bz;
        dists.push([dx * dx + dy * dy + dz * dz, j]);
      }
      dists.sort((a, b) => a[0] - b[0]);
      for (let k = 0; k < K; k++) {
        const j = dists[k][1];
        const key = i < j ? i + '_' + j : j + '_' + i;
        edges.push({ a: i, b: j, key });
      }
    }
    // de-dupe
    const seen = new Set();
    for (let i = edges.length - 1; i >= 0; i--) {
      if (seen.has(edges[i].key)) edges.splice(i, 1);
      else seen.add(edges[i].key);
    }
  }

  // ---------- Rotation / projection ----------
  let angleY = 0;
  let t0 = performance.now();
  const ROT_SPEED = 0.16; // radians / second

  function rotateY(p, a) {
    const cos = Math.cos(a), sin = Math.sin(a);
    return {
      x: p.bx * cos + p.bz * sin,
      y: p.by,
      z: -p.bx * sin + p.bz * cos,
    };
  }

  function project(p, cx, cy, scale, focal, tiltX, bob) {
    // slight organic tilt on X axis
    const cosT = Math.cos(tiltX), sinT = Math.sin(tiltX);
    const y1 = p.y * cosT - p.z * sinT;
    const z1 = p.y * sinT + p.z * cosT;
    const persp = focal / (focal + z1 + focal);
    return {
      x: cx + p.x * scale * persp,
      y: cy + bob + y1 * scale * persp,
      z: z1,
      s: persp,
    };
  }

  function draw(now) {
    const dt = Math.min((now - t0) / 1000, 0.05);
    t0 = now;
    angleY += ROT_SPEED * dt;
    const time = now / 1000;

    ctx.clearRect(0, 0, W, H);

    const cx = W / 2;
    const cy = H / 2;
    const scale = Math.min(W, H) * 0.34;
    const focal = 2.6;
    const tiltX = Math.sin(time * 0.12) * 0.12;
    const bob = Math.sin(time * 0.5) * H * 0.01;

    // ---- ambient halo behind everything ----
    const haloR = Math.min(W, H) * 0.46 * (1 + Math.sin(time * 0.3) * 0.02);
    const halo = ctx.createRadialGradient(cx, cy + bob, 0, cx, cy + bob, haloR);
    halo.addColorStop(0.0, 'rgba(168,139,250,0.16)');
    halo.addColorStop(0.35, 'rgba(236,121,203,0.10)');
    halo.addColorStop(0.7, 'rgba(94,234,212,0.05)');
    halo.addColorStop(1.0, 'rgba(94,234,212,0.0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(cx, cy + bob, haloR, 0, Math.PI * 2);
    ctx.fill();

    ctx.globalCompositeOperation = 'lighter';

    // ---- project mesh points ----
    const proj = new Array(meshPoints.length);
    for (let i = 0; i < meshPoints.length; i++) {
      const r = rotateY(meshPoints[i], angleY);
      proj[i] = project(r, cx, cy, scale, focal, tiltX, bob);
    }

    // ---- edges ----
    ctx.lineWidth = 1;
    for (const e of edges) {
      const a = proj[e.a], b = proj[e.b];
      const depth = (a.s + b.s) / 2;
      const alpha = Math.max(0, Math.min(1, (depth - 0.55) / 0.7)) * 0.22;
      if (alpha <= 0.003) continue;
      const cA = hexToRgb(meshPoints[e.a].color);
      ctx.strokeStyle = `rgba(${cA.r},${cA.g},${cA.b},${alpha})`;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }

    // ---- mesh points ----
    for (let i = 0; i < meshPoints.length; i++) {
      const p = meshPoints[i];
      const pr = proj[i];
      const twinkle = 0.55 + 0.45 * Math.sin(time * p.freq + p.phase);
      const depth = Math.max(0.35, Math.min(1.3, pr.s));
      const size = p.size * depth * (0.8 + 0.4 * twinkle);
      const alpha = Math.max(0, Math.min(1, (depth - 0.5) / 0.8)) * (0.35 + 0.5 * twinkle);
      const c = hexToRgb(p.color);
      ctx.beginPath();
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 6 * depth;
      ctx.arc(pr.x, pr.y, Math.max(0.3, size), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // ---- spark points (bright highlight nodes) ----
    for (const p of sparkPoints) {
      const r = rotateY(p, angleY);
      const pr = project(r, cx, cy, scale, focal, tiltX, bob);
      const twinkle = 0.5 + 0.5 * Math.sin(time * p.freq + p.phase);
      const depth = Math.max(0.35, Math.min(1.3, pr.s));
      const size = p.size * depth * (0.7 + 0.6 * twinkle);
      const alpha = Math.max(0, Math.min(1, (depth - 0.5) / 0.8)) * (0.55 + 0.45 * twinkle);
      const c = hexToRgb(p.color);
      ctx.beginPath();
      ctx.fillStyle = `rgba(${Math.min(255, c.r + 60)},${Math.min(255, c.g + 60)},${Math.min(255, c.b + 60)},${alpha})`;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12 * depth;
      ctx.arc(pr.x, pr.y, Math.max(0.4, size), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // ---- ambient dust ----
    for (const p of dustPoints) {
      const r = rotateY(p, angleY * 0.6 + p.driftSpeed * time);
      const pr = project(r, cx, cy, scale, focal, tiltX, bob);
      const twinkle = 0.5 + 0.5 * Math.sin(time * p.freq + p.phase);
      const depth = Math.max(0.3, Math.min(1.3, pr.s));
      const alpha = Math.max(0, Math.min(1, (depth - 0.4) / 0.9)) * (0.25 + 0.35 * twinkle);
      const c = hexToRgb(p.color);
      ctx.beginPath();
      ctx.fillStyle = `rgba(${c.r},${c.g},${c.b},${alpha})`;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 5 * depth;
      ctx.arc(pr.x, pr.y, Math.max(0.3, p.size * depth), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    requestAnimationFrame(draw);
  }

  requestAnimationFrame(draw);
})();
</script>
</body>
</html>
